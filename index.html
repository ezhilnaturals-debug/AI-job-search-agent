
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Job Finder</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0e1423;color:#f4f6fb;font-family:Arial,sans-serif}
header{padding:24px 18px;background:#18243a}
header h1{margin:0;font-size:25px}
header p{color:#aab6cb;font-size:14px}
main{padding:16px}
.card{background:#1b263b;padding:16px;border-radius:14px;margin-bottom:14px}
label{display:block;margin:12px 0 6px;font-size:13px;color:#b9c5d8}
input,select,button{width:100%;padding:14px;margin-top:8px;border-radius:10px;font-size:15px}
input,select{background:#101b2d;color:white;border:1px solid #394965}
button{background:#45ce91;color:#07180f;font-weight:bold;border:0}
.quick button{background:#263650;color:#e9f1ff;margin-bottom:8px}
.result{background:#1b263b;padding:15px;border-radius:12px;margin:12px 0}
.result h3{margin-top:0}
a{display:block;text-decoration:none;color:#70dbac;background:#273953;padding:12px;border-radius:9px;margin-top:8px;text-align:center}
.note{font-size:12px;color:#9eabc0;line-height:1.6}
</style>
</head>
<body>
<header>
<h1>🤖 AI Job Finder</h1>
<p>Find your next career opportunity</p>
</header>
<main>

<div class="card">
<h3>🔎 Job Search</h3>

<label>Job title / keywords</label>
<input id="keyword" value="Supply Chain OR Procurement OR Order Management">

<label>Location</label>
<select id="location">
<option>Chennai</option>
<option>Remote India</option>
<option>Bengaluru</option>
<option>Hyderabad</option>
<option>Coimbatore</option>
<option>India</option>
</select>

<button onclick="searchJobs()">Search Jobs</button>
</div>

<div class="card quick">
<h3>⚡ Quick Search</h3>
<button onclick="quick('Supply Chain Manager')">Supply Chain</button>
<button onclick="quick('Procurement Purchase Order')">Procurement / PO</button>
<button onclick="quick('Order Management')">Order Management</button>
<button onclick="quick('Operations Manager')">Operations</button>
<button onclick="quick('Inventory Planning')">Inventory Planning</button>
<button onclick="quick('Supply Chain Remote')">Remote Jobs</button>
</div>

<div id="results"></div>

<p class="note">
Search links open external job websites. Verify job details, employer and posting date on the job site before applying.
</p>
</main>

<script>
function quick(term){
 document.getElementById("keyword").value=term;
 searchJobs();
}

function searchJobs(){
 const keyword=document.getElementById("keyword").value.trim();
 const location=document.getElementById("location").value;
 if(!keyword){
  alert("Please enter a job title or keyword");
  return;
 }

 const q=encodeURIComponent(keyword+" "+location);
 const jobs=[
  {name:"LinkedIn Jobs",url:"https://www.linkedin.com/jobs/search/?keywords="+q},
  {name:"Indeed",url:"https://in.indeed.com/jobs?q="+encodeURIComponent(keyword)+"&l="+encodeURIComponent(location)},
  {name:"Naukri",url:"https://www.naukri.com/"+encodeURIComponent(keyword.toLowerCase().replace(/ /g,"-"))+"-jobs-in-"+encodeURIComponent(location.toLowerCase().replace(/ /g,"-"))},
  {name:"Google Jobs",url:"https://www.google.com/search?q="+q+" jobs"}
 ];

 let html="<div class='card'><h3>🌐 Search Results</h3><p>Search: "+keyword+"<br>Location: "+location+"</p>";
 jobs.forEach(j=>{
  html+="<div class='result'><b>"+j.name+"</b><a href='"+j.url+"' target='_blank' rel='noopener'>Open "+j.name+" ↗</a></div>";
 });
 html+="</div>";
 document.getElementById("results").innerHTML=html;
}
</script>
</body>
</html>
