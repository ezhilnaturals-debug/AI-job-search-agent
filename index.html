
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Job Finder</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0e1423;
  color: #f4f6fb;
}
header {
  padding: 24px 18px;
  background: #172238;
}
header h1 { margin: 0; font-size: 25px; }
header p { color: #aab6cb; font-size: 14px; }
main { padding: 16px; }
.stats {
  display: flex;
  gap: 10px;
}
.stat {
  flex: 1;
  background: #1b263b;
  padding: 16px 10px;
  border-radius: 14px;
}
.stat b { font-size: 22px; color: #65d6a5; }
.stat small { display: block; color: #b6c1d4; margin-top: 5px; }
input, select, button {
  width: 100%;
  padding: 13px;
  margin-top: 12px;
  border-radius: 10px;
  border: 1px solid #35445c;
  font-size: 15px;
}
input, select {
  background: #182338;
  color: white;
}
button {
  background: #42c78a;
  color: #08150e;
  border: none;
  font-weight: bold;
}
.section-title {
  margin-top: 25px;
  margin-bottom: 12px;
}
.job {
  background: #1b263b;
  padding: 16px;
  border-radius: 14px;
  margin-bottom: 13px;
  border: 1px solid #293850;
}
.job h3 { margin: 0 0 8px; }
.job p { color: #b7c2d6; font-size: 14px; }
.score {
  color: #63dda4;
  font-weight: bold;
}
.tag {
  display: inline-block;
  padding: 6px 9px;
  background: #293750;
  color: #cbd8ed;
  border-radius: 20px;
  font-size: 12px;
  margin: 3px;
}
.save {
  background: #34425d;
  color: white;
}
footer {
  text-align: center;
  color: #8896ac;
  padding: 25px;
  font-size: 12px;
}
</style>
</head>
<body>

<header>
  <h1>🤖 AI Job Finder</h1>
  <p>Your personal career opportunity assistant</p>
</header>

<main>
  <div class="stats">
    <div class="stat">
      <b id="total">0</b>
      <small>Jobs found</small>
    </div>
    <div class="stat">
      <b id="saved">0</b>
      <small>Saved jobs</small>
    </div>
  </div>

  <h3 class="section-title">🔎 Find your next job</h3>

  <input id="keyword" placeholder="Job title or skill">

  <select id="location">
    <option value="all">All locations</option>
    <option value="Chennai">Chennai</option>
    <option value="Remote">Remote - India</option>
    <option value="Bangalore">Bangalore</option>
    <option value="Hyderabad">Hyderabad</option>
  </select>

  <button onclick="searchJobs()">Search Jobs</button>

  <h3 class="section-title">💼 Recommended jobs</h3>
  <div id="jobs"></div>
</main>

<footer>AI Job Finder • Your career companion</footer>

<script>
const jobData = [
 {
  title:"Supply Chain Manager",
  company:"ABC Manufacturing",
  location:"Chennai",
  salary:"Salary not disclosed",
  score:92,
  skills:"Supply Chain, ERP, Inventory"
 },
 {
  title:"Order Management Manager",
  company:"XYZ Technologies",
  location:"Chennai",
  salary:"₹8–12 LPA (example)",
  score:89,
  skills:"Order Management, ERP, PO"
 },
 {
  title:"Procurement Specialist",
  company:"Global Solutions",
  location:"Bangalore",
  salary:"Salary not disclosed",
  score:84,
  skills:"Procurement, Vendor Management"
 },
 {
  title:"Operations Analyst",
  company:"Fintech Company",
  location:"Remote",
  salary:"Salary not disclosed",
  score:80,
  skills:"Operations, Excel, Reporting"
 },
 {
  title:"Supply Chain Operations",
  company:"India Services",
  location:"Chennai",
  salary:"Salary not disclosed",
  score:87,
  skills:"Operations, Inventory, Logistics"
 }
];

let savedJobs = [];

function displayJobs(list) {
 const container = document.getElementById("jobs");
 container.innerHTML = "";
 document.getElementById("total").textContent = list.length;
 document.getElementById("saved").textContent = savedJobs.length;

 if(list.length === 0) {
   container.innerHTML = "<p>No matching jobs found.</p>";
   return;
 }

 list.forEach((job,index) => {
   container.innerHTML += `
    <div class="job">
      <h3>${job.title}</h3>
      <p>🏢 ${job.company}</p>
      <p>📍 ${job.location}</p>
      <p>💰 ${job.salary}</p>
      <p class="score">⭐ Match: ${job.score}%</p>
      <span class="tag">${job.skills}</span>
      <button class="save" onclick="saveJob(${index})">
        ☆ Save Job
      </button>
    </div>`;
 });
}

function searchJobs() {
 const keyword = document.getElementById("keyword").value.toLowerCase();
 const location = document.getElementById("location").value;

 const filtered = jobData.filter(job => {
  const matchesKeyword =
    !keyword ||
    job.title.toLowerCase().includes(keyword) ||
    job.skills.toLowerCase().includes(keyword);

 const matchesLocation =
   location === "all" ||
   job.location.toLowerCase().includes(location.toLowerCase());

 return matchesKeyword && matchesLocation;
 });

 displayJobs(filtered);
}

function saveJob(index) {
 const job = jobData[index];
 if(!savedJobs.some(j => j.title === job.title)) {
   savedJobs.push(job);
 }
 document.getElementById("saved").textContent = savedJobs.length;
 alert("Job saved!");
}

displayJobs(jobData);
</script>
</body>
</html>
